<!DOCTYPE html>
<html>
  <head>
    <title>Candidate Dashboard</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              main: "#124265",
            },
          },
        },
      };
    </script>

  <body>
    <div class="flex flex-col">
      <div class="flex justify-between items-center border-b-2 pb-4">
        <div class="flex items-center gap-4">
          <div class="w-20 h-20 bg-blue-300 rounded-full shadow-md"></div>
          <div class="text-left">
            <h1 class="text-2xl font-bold">John Doe</h1>
            <p class="text-sm">Software Developer</p>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <button class="bg-blue-500 text-white px-4 py-2 rounded-lg">
            Edit Profile
          </button>
          <button class="bg-blue-500 text-white px-4 py-2 rounded-lg">
            Logout
          </button>
        </div>
      </div>
    </div>

      <h1 class="text-black-800 text-3xl p-7">Decentitle</h1>

        <input
          type="text"
          placeholder="Search..."
          class="w-full p-2.5 rounded border-none"
        />
      </div>
    </div>
